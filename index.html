<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daydream</title>
  <!-- Favicon to avoid 404 console errors on hosted servers -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <!-- p5.js CDN library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <!-- Container where our game canvas and lobby UI live -->
  <div id="game-container">
    <!-- Welcoming Lobby Overlay Screen -->
    <div id="lobby-screen">
      <div class="lobby-card">
        <!-- 1. Game Branding -->
        <div class="lobby-header">
          <h1 class="game-title">Daydream</h1>
        </div>

        <!-- 4. Interactive Ball Preview -->
        <div class="preview-section">
          <div id="preview-name">Daydreamer</div>
          <div id="preview-ball">
            <span id="preview-score">0</span>
          </div>
        </div>

        <!-- 2. Username Input -->
        <div class="input-section">
          <label for="username-input" class="input-label">Your Name</label>
          <input
            type="text"
            id="username-input"
            maxlength="12"
            autocomplete="off"
            spellcheck="false"
          />
          <div id="error-message" class="error-message"></div>
        </div>

        <!-- 3. Color Selection (8 Pastel Colors) -->
        <div class="color-section">
          <label class="input-label">Choose Color</label>
          <div class="color-palette" id="color-palette">
            <!-- Swatches will be generated by JavaScript or static buttons -->
          </div>
        </div>

        <!-- 5. PLAY Button -->
        <button id="play-button" type="button">PLAY</button>
      </div>
    </div>
  </div>

  <!-- Firebase App & Realtime Database SDKs (Compat version for easy vanilla script usage) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Firebase setup & multiplayer networking -->
  <script src="firebase-config.js"></script>

  <!-- Game logic script -->
  <script src="sketch.js"></script>
</body>
</html>
